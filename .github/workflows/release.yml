name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # GitHub attaches the tagged source to the release alongside the packages.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blackshades-macos.zip
          path: dist
          # Keep the zip itself rather than extracting the app from it.
          skip-decompress: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blackshades-steamdeck.tar.gz
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/blackshades-macos.zip \
            dist/blackshades-steamdeck.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
